    <rect x="450" y="84" width="714" height="492" rx="10" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.45" filter="url(#glow3)"/>
    <rect x="450" y="84" width="714" height="492" rx="10" fill="#0A101F" stroke="rgba(167,139,250,0.35)"/>

    <!-- Terminal prompt lines -->
    <text x="470" y="114" font-size="12" fill="#22D3EE">~/Nandinimane511</text>
    <text x="690" y="114" font-size="12" fill="#475569"> on </text>
    <text x="716" y="114" font-size="12" fill="#10B981">⎇ main</text>
    <text x="800" y="114" font-size="12" fill="#A78BFA"> ❯ </text>
    <text x="820" y="114" font-size="12" fill="#F8FAFC">cat about.json</text>

    <!-- JSON output block -->
    <rect x="470" y="122" width="674" height="148" rx="6" fill="#070D1A" stroke="#1E293B"/>
    <text x="486" y="140" font-size="11" fill="#475569">{</text>
    <text x="502" y="157" font-size="11" fill="#A78BFA">"name"</text>
    <text x="558" y="157" font-size="11" fill="#475569">:</text>
    <text x="568" y="157" font-size="11" fill="#10B981">"Nandini Mane"</text>
    <text x="502" y="173" font-size="11" fill="#A78BFA">"role"</text>
    <text x="558" y="173" font-size="11" fill="#475569">:</text>
    <text x="568" y="173" font-size="11" fill="#10B981">"AI Engineer · Full Stack Developer"</text>
    <text x="502" y="189" font-size="11" fill="#A78BFA">"university"</text>
    <text x="588" y="189" font-size="11" fill="#475569">:</text>
    <text x="598" y="189" font-size="11" fill="#10B981">"Computer Engineering Student"</text>
    <text x="502" y="205" font-size="11" fill="#A78BFA">"location"</text>
    <text x="576" y="205" font-size="11" fill="#475569">:</text>
    <text x="586" y="205" font-size="11" fill="#10B981">"Mumbai, India"</text>
    <text x="502" y="221" font-size="11" fill="#A78BFA">"skills"</text>
    <text x="558" y="221" font-size="11" fill="#475569">:</text>
    <text x="568" y="221" font-size="11" fill="#10B981">["React","Java","Python","ML","Node.js"]</text>
    <text x="502" y="237" font-size="11" fill="#A78BFA">"status"</text>
    <text x="564" y="237" font-size="11" fill="#475569">:</text>
    <text x="574" y="237" font-size="11" fill="#22D3EE">"Open to placements 🚀"</text>
    <text x="486" y="253" font-size="11" fill="#475569">}</text>

    <!-- Second prompt -->
    <text x="470" y="284" font-size="12" fill="#22D3EE">~/Nandinimane511</text>
    <text x="690" y="284" font-size="12" fill="#A78BFA"> ❯ </text>
    <text x="710" y="284" font-size="12" fill="#F8FAFC">ls projects/</text>

    <!-- Project list -->
    <rect x="470" y="292" width="674" height="92" rx="6" fill="#070D1A" stroke="#1E293B"/>
    <text x="486" y="310" font-size="11" fill="#22D3EE">📚</text>
    <text x="506" y="310" font-size="11" fill="#F8FAFC">DeepDetect-DeepFake</text>
    <text x="700" y="310" font-size="11" fill="#64748B">Python · PyTorch · OpenCV</text>

    <text x="486" y="328" font-size="11" fill="#22D3EE">💊</text>
    <text x="506" y="328" font-size="11" fill="#F8FAFC">New-MedStock</text>
    <text x="700" y="328" font-size="11" fill="#64748B">React · Java · MySQL</text>

    <text x="486" y="346" font-size="11" fill="#22D3EE">🌐</text>
    <text x="506" y="346" font-size="11" fill="#F8FAFC">nandini-portfolio</text>
    <text x="700" y="346" font-size="11" fill="#64748B">React · TailwindCSS</text>

    <text x="486" y="364" font-size="11" fill="#10B981">+3 more repos ...</text>

    <!-- Third prompt -->
    <text x="470" y="402" font-size="12" fill="#22D3EE">~/Nandinimane511</text>
    <text x="690" y="402" font-size="12" fill="#A78BFA"> ❯ </text>
    <text x="710" y="402" font-size="12" fill="#F8FAFC">git log --oneline -5</text>

    <!-- Commit log -->
    <rect x="470" y="410" width="674" height="92" rx="6" fill="#070D1A" stroke="#1E293B"/>
    <text x="486" y="428" font-size="10.5" fill="#A78BFA">a4f21b3</text>
    <text x="540" y="428" font-size="10.5" fill="#F8FAFC">Add DeepFake detection model (PyTorch)</text>
    <text x="486" y="445" font-size="10.5" fill="#A78BFA">c9e83d1</text>
    <text x="540" y="445" font-size="10.5" fill="#F8FAFC">Implement inventory alerts in MedStock</text>
    <text x="486" y="462" font-size="10.5" fill="#A78BFA">7b12f90</text>
