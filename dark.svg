    </rect>
    <text x="378" y="538" font-size="9" fill="#64748B">80%</text>

    <!-- ML/AI -->
    <text x="60"  y="554" font-size="10" fill="#94A3B8">ML/AI</text>
    <rect x="120" y="545" width="250" height="7" rx="3" fill="#1E293B"/>
    <rect x="120" y="545" width="187" height="7" rx="3" fill="url(#accent)" opacity="0.8">
