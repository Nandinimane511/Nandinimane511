    <text x="76" y="372" font-size="11" fill="#64748B">location</text>
    <text x="150" y="372" font-size="11" fill="#F8FAFC">Mumbai, India 🇮🇳</text>

    <text x="60" y="390" font-size="11" fill="#22D3EE">❯</text>
    <text x="76" y="390" font-size="11" fill="#64748B">degree</text>
    <text x="150" y="390" font-size="11" fill="#F8FAFC">B.E. Computer Engineering</text>

    <text x="60" y="408" font-size="11" fill="#22D3EE">❯</text>
    <text x="76" y="408" font-size="11" fill="#64748B">focus</text>
    <text x="150" y="408" font-size="11" fill="#F8FAFC">AI · Full Stack · ML</text>

    <text x="60" y="426" font-size="11" fill="#22D3EE">❯</text>
    <text x="76" y="426" font-size="11" fill="#64748B">status</text>
    <text x="150" y="426" font-size="11" fill="#10B981">Open to placements 🚀</text>

