<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
  font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
  role="img" aria-label="Nandini Mane — profile.sh --live">

  <defs>
    <!-- Animated accent gradient (purple → cyan → emerald loop) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Background panel gradient -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow8" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="txtGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Clip to rounded window -->
    <clipPath id="winClip">
      <rect x="2" y="2" width="1176" height="606" rx="18"/>
    </clipPath>
  </defs>

  <!-- ── Window frame ── -->
  <rect x="2" y="2" width="1176" height="606" rx="18" fill="#070B16"/>
  <g clip-path="url(#winClip)">
    <rect x="2" y="2" width="1176" height="606" fill="url(#panelGrad)"/>

    <!-- Title bar -->
    <rect x="2" y="2" width="1176" height="46" fill="#0B1222"/>
    <line x1="2" y1="48" x2="1178" y2="48" stroke="rgba(255,255,255,0.10)"/>

    <!-- macOS traffic-light dots -->
    <circle cx="30"  cy="25" r="5.5" fill="#ff5f56"/>
    <circle cx="50"  cy="25" r="5.5" fill="#ffbd2e"/>
    <circle cx="70"  cy="25" r="5.5" fill="#27c93f"/>

    <!-- Title bar text -->
    <text x="590" y="29" text-anchor="middle" font-size="12" fill="#94A3B8">
      nandinimane511.connect@github.com — % ./profile.sh --live
    </text>

    <!-- ═══════════════════════════════════════════════════
         LEFT PANEL — ASCII portrait + identity
         ═══════════════════════════════════════════════════ -->
    <text x="38" y="74" font-size="10" letter-spacing="3" fill="#475569">VISUAL.MAP</text>

    <!-- Left panel box -->
    <rect x="36" y="84" width="400" height="492" rx="10" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.45" filter="url(#glow3)"/>
    <rect x="36" y="84" width="400" height="492" rx="10" fill="#0A101F" stroke="rgba(34,211,238,0.35)"/>

    <!-- ── Animated pixel-art silhouette (simplified geometric portrait) ── -->
    <!-- Head shape -->
    <ellipse cx="236" cy="168" rx="52" ry="60" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Hair (top arc) -->
    <path d="M186 155 Q190 120 236 118 Q282 120 286 155" fill="#A78BFA" opacity="0.7"/>

    <!-- Face fill -->
    <ellipse cx="236" cy="170" rx="48" ry="54" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Eyes -->
    <ellipse cx="218" cy="162" rx="6" ry="7" fill="#0A101F" stroke="#22D3EE" stroke-width="1"/>
    <ellipse cx="254" cy="162" rx="6" ry="7" fill="#0A101F" stroke="#22D3EE" stroke-width="1"/>
    <circle cx="219" cy="162" r="3" fill="#22D3EE" opacity="0.9"/>
    <circle cx="255" cy="162" r="3" fill="#22D3EE" opacity="0.9"/>
    <!-- Eye glints -->
    <circle cx="221" cy="160" r="1.2" fill="white" opacity="0.9"/>
    <circle cx="257" cy="160" r="1.2" fill="white" opacity="0.9"/>

    <!-- Nose -->
    <path d="M234 172 Q236 180 238 172" stroke="#475569" stroke-width="1.2" fill="none"/>

    <!-- Smile -->
    <path d="M220 186 Q236 196 252 186" stroke="#A78BFA" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Ears -->
    <ellipse cx="188" cy="170" rx="6" ry="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <ellipse cx="284" cy="170" rx="6" ry="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Neck & shoulders -->
    <rect x="224" y="225" width="24" height="22" rx="4" fill="#1E293B"/>
    <path d="M170 254 Q200 238 236 235 Q272 238 302 254 L308 290 L164 290 Z" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Collar / outfit detail -->
    <path d="M220 240 L236 258 L252 240" stroke="#22D3EE" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Glow halo around portrait -->
    <ellipse cx="236" cy="200" rx="80" ry="90" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.15" filter="url(#glow8)"/>

    <!-- ── Name & title ── -->
    <text x="236" y="318" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#accent)" filter="url(#txtGlow)">
