# ════════════════════════════════════════════════════════
#  Contribution Snake — GitHub Actions Workflow
#  File path: .github/workflows/snake.yml
#
#  SETUP:
#  1. Create this file in your profile repo at the exact path above
#  2. Go to: Repo Settings → Actions → General → Workflow permissions
#     → Select "Read and write permissions" → Save
#  3. Go to Actions tab → "Generate Snake" → Run workflow (first time)
#  4. After it runs, an "output" branch is created automatically
#     with the snake SVG files inside it.
#  5. The snake image in your README will appear once that branch exists.
# ════════════════════════════════════════════════════════

name: Generate Snake

on:
  # Runs every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Also runs on every push to main
  push:
    branches:
      - main

  # Allows you to run this manually from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVG (Light & Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
