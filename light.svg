<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
  font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
  role="img" aria-label="Nandini Mane — profile.sh --live">

  <defs>
    <!-- Animated accent gradient (purple → cyan → teal loop) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0891B2;#059669;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#059669;#7C3AED;#0891B2" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#7C3AED;#0891B2;#059669" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Light background panel gradient -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Glow filters (lighter for light mode) -->
    <filter id="glow8" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="txtGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="winClip">
      <rect x="2" y="2" width="1176" height="606" rx="18"/>
    </clipPath>
  </defs>

